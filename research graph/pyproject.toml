[project]
name = "research-graph"
version = "0.1.0"
description = "LangGraph project that builds an interview prep document from a JD"
readme = "README.md"
authors = [
    { name = "Qaisar Moin", email = "mqmoin@cloudlex.com" }
]
requires-python = ">=3.14"

dependencies = [
    "langgraph>=0.2.60",
    "openai>=1.40",
    "requests>=2.32",
    "ddgs>=9.0",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "langchain-openai>=1.6.0",
]

# This is an APPLICATION, not a library - nobody will pip install it and
# import it. So no build backend is needed.
[tool.uv]
package = false

# Only for scanned PDFs. Running these also needs two SEPARATE WINDOWS
# PROGRAMS (Tesseract and Poppler), pip alone is not enough.
# If you need it:  uv sync --group ocr
