[project]
name = "research-graph"
version = "0.1.0"
description = "LangGraph project that builds an interview prep document from a JD"
readme = "README.md"
authors = [
    { name = "Qaisar Moin", email = "mqmoin@cloudlex.com" }
]
requires-python = ">=3.14"

dependencies = [
    "langgraph>=0.2.60",
    "openai>=1.40",
    "requests>=2.32",
    "ddgs>=9.0",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "langchain-openai>=1.6.0",
    # --- Auth / database (same stack as CaseDesk) ---
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "python-jose>=3.3",        # JWT encode/decode
    "cryptography>=43.0",      # signing backend for python-jose
    "passlib>=1.7.4",          # password hashing wrapper
    "bcrypt==4.0.1",           # pinned: passlib 1.7.4 breaks on bcrypt >= 4.1
    "email-validator>=2.2",    # required by pydantic's EmailStr
]

# This is an APPLICATION, not a library - nobody will pip install it and
# import it. So no build backend is needed.
[tool.uv]
package = false

# Only for scanned PDFs. pytesseract is a wrapper - TESSERACT ITSELF IS A
# SEPARATE WINDOWS PROGRAM, pip alone is not enough:
#     winget install UB-Mannheim.TesseractOCR
# pypdfium2 turns a PDF page into an image. pdf2image would do the same but
# needs Poppler, a second Windows program - this way there is only one.
#     uv sync --group ocr
[dependency-groups]
ocr = [
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
]
